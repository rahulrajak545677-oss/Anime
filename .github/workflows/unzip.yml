name: Unzip
on:
  push:
    paths: ['ClassicAnime.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ClassicAnime.zip
          cp -r ClassicAnime/. .
          rm -rf ClassicAnime ClassicAnime.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project"
          git push
